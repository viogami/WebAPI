server:
  host: ""
  port: 8080
  ginMode: release
  # 仅当反向代理的地址或网段在此列表中时，才信任 X-Forwarded-For。
  trustedProxies: []
  rateLimit:
    requestsPerSecond: 5
    burst: 20
    idleTTLSeconds: 600

text:
  helloText: "WebAPI is running"

p5cc:
  assetPath: "core/p5cc/assets/"
  fontSize: 120
  fontFamily: "core/p5cc/assets/HarmonyOSSansSC-Bold.TTF"
  gutter: 10
  padding: 240
  textAlign: center
  redProb: 0.33
  showLogo: true
  logoScale: 1.0
  logoOffset: 240
  showWtm: ""

ch:
  enabled: false
  sessionTTLHours: 168
